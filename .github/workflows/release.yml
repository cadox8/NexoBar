name: Build and publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag (vX.Y.Z)
        required: true

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            preset: ci-windows
          - os: ubuntu-latest
            platform: linux-x64
            preset: ci-linux
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: "true"
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite
      NEXOBAR_REQUIRE_CODESIGN: ${{ matrix.os == 'windows-latest' && 'ON' || 'OFF' }}
      NEXOBAR_CODESIGN_THUMBPRINT: ${{ matrix.os == 'windows-latest' && secrets.NEXOBAR_CODESIGN_THUMBPRINT || '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.preset }}-
      - name: Set up compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install producer code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PRODUCER_PFX_BASE64: ${{ secrets.NEXOBAR_CODESIGN_PFX_BASE64 }}
          PRODUCER_PFX_PASSWORD: ${{ secrets.NEXOBAR_CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PRODUCER_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:PRODUCER_PFX_PASSWORD) -or
              [string]::IsNullOrWhiteSpace($env:NEXOBAR_CODESIGN_THUMBPRINT)) {
            throw 'The producer code-signing secrets are required for a Windows release.'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'nexobar-producer.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PRODUCER_PFX_BASE64))
          $password = ConvertTo-SecureString $env:PRODUCER_PFX_PASSWORD -AsPlainText -Force
          $certificate = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password) |
            Where-Object { $_.HasPrivateKey } |
            Select-Object -First 1
          if ($null -eq $certificate) {
            throw 'The producer PFX does not contain a certificate with a private key.'
          }
          $codeSigningEku = $certificate.EnhancedKeyUsageList |
            Where-Object { $_.ObjectId -eq '1.3.6.1.5.5.7.3.3' } |
            Select-Object -First 1
          if ($null -eq $codeSigningEku) {
            throw 'The producer certificate does not contain the Code Signing EKU.'
          }
          $expected = $env:NEXOBAR_CODESIGN_THUMBPRINT.Replace(' ', '').ToUpperInvariant()
          if ($certificate.Thumbprint.ToUpperInvariant() -ne $expected) {
            throw 'The imported producer certificate does not match NEXOBAR_CODESIGN_THUMBPRINT.'
          }
          Remove-Item -LiteralPath $pfxPath -Force
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          ninja-build
          autoconf
          autoconf-archive
          automake
          libtool
          libudev-dev
          libasound2-dev
          libx11-dev
          libxrandr-dev
          libxinerama-dev
          libxcursor-dev
          libxi-dev
          libgl1-mesa-dev
      - uses: lukka/get-cmake@latest
      - uses: lukka/run-vcpkg@v11
      - uses: lukka/run-cmake@v10
        with:
          configurePreset: ${{ matrix.preset }}
          buildPreset: ${{ matrix.preset }}
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
      - name: Install package tree
        run: cmake --install build --prefix package
      - name: Create archive
        shell: bash
        run: cmake -E tar cfv "NexoBar-${{ matrix.platform }}.zip" --format=zip package
      - uses: actions/upload-artifact@v4
        with:
          name: NexoBar-${{ matrix.platform }}
          path: NexoBar-${{ matrix.platform }}.zip

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: NexoBar-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: NexoBar-*.zip
